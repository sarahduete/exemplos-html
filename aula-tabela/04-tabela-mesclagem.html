<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem</title>
</head>
<style>
  table { border-collapse: collapse; }
  th, td { border: 1px solid #a3a39a; padding: 8px 14px; text-align: center; }
  th { background: #f4f4ee; }
  [rowspan] { background: #ff27be49; }
  [colspan] { background: #fdf6c8; }
</style>
<body>
    <table>
  <tr>
    <th>Horário</th> <th>Seg</th> <th>Ter</th> <th>Qua</th>
  </tr>
  <tr>
    <td>08:00</td>
    <td rowspan="2">Matemática</td>
    <td>História</td>
    <td>Física</td>
  </tr>
  <tr>
    <td>09:00</td>
    <td>Geografia</td>
    <td>Química</td>
  </tr>
  <tr>
    <td>10:00</td>
    <td colspan="3">Intervalo</td>
  </tr>
</table>
</body>
</html>
